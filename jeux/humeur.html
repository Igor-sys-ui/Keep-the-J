<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Météo de l'humeur — Keep The J</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .humeurs-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .humeur-card { background: var(--blanc); border-radius: var(--rayon); padding: 20px 14px; box-shadow: var(--ombre); text-align: center; }
    .humeur-card.moi   { border-top: 4px solid var(--rose-fonce); }
    .humeur-card.autre { border-top: 4px solid #2a6fc4; }
    .humeur-emoji-grand { font-size: 3rem; display: block; margin-bottom: 8px; }
    .humeur-nom-joueur  { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
    .humeur-label       { font-size: 0.85rem; color: var(--gris); margin-bottom: 4px; }
    .humeur-depuis      { font-size: 0.72rem; color: #bbb; }
    .form-humeur { background: var(--blanc); border-radius: var(--rayon); padding: 20px; box-shadow: var(--ombre); margin-bottom: 24px; }
    .form-humeur h2 { margin-bottom: 14px; }
    .grille-humeurs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .humeur-btn { padding: 10px 4px; border: 2px solid #eee; border-radius: 12px; background: var(--blanc); cursor: pointer; text-align: center; transition: all 0.15s; font-size: 0.72rem; color: var(--gris); }
    .humeur-btn .h-emoji { font-size: 1.6rem; display: block; margin-bottom: 3px; }
    .humeur-btn:hover { border-color: var(--rose); background: var(--rose-clair); }
    .humeur-btn.selec { border-color: var(--rose-fonce); background: var(--rose-clair); color: var(--rose-fonce); font-weight: 700; }
    .tabs { display: flex; background: var(--gris-clair); border-radius: var(--rayon); padding: 4px; margin-bottom: 16px; }
    .tab  { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--gris); }
    .tab.actif { background: var(--blanc); color: var(--rose-fonce); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .section-titre { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--gris); margin-bottom: 12px; }
    .vide { text-align: center; padding: 32px 0; color: #bbb; font-size: 0.9rem; }
    #panneau-histo { display: none; }
    .graph-wrap { background: var(--blanc); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 16px; margin-bottom: 16px; }
    .graph-titre  { font-size: 0.82rem; color: var(--gris); margin-bottom: 12px; font-weight: 600; }
    .graph-legende { display: flex; gap: 16px; margin-bottom: 12px; font-size: 0.75rem; color: var(--gris); }
    .legende-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
    #graphique { width: 100%; display: block; }
    .filtres-periode { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .filtre-btn { padding: 5px 12px; border-radius: 20px; border: 1.5px solid #ddd; background: var(--blanc); font-size: 0.78rem; font-weight: 600; cursor: pointer; color: var(--gris); }
    .filtre-btn.actif { border-color: var(--rose-fonce); color: var(--rose-fonce); background: var(--rose-clair); }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <a href="../app.html" class="back">←</a>
    <h1>🌤️ Météo de l'humeur</h1>
  </div>

  <div class="humeurs-duo">
    <div class="humeur-card moi">
      <span class="humeur-emoji-grand" id="emoji-moi">❓</span>
      <div class="humeur-nom-joueur" id="nom-moi">—</div>
      <div class="humeur-label"      id="label-moi">Pas encore renseigné</div>
      <div class="humeur-depuis"     id="depuis-moi"></div>
    </div>
    <div class="humeur-card autre">
      <span class="humeur-emoji-grand" id="emoji-autre">❓</span>
      <div class="humeur-nom-joueur"  id="nom-autre">—</div>
      <div class="humeur-label"       id="label-autre">Pas encore renseigné</div>
      <div class="humeur-depuis"      id="depuis-autre"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab actif" onclick="afficherOnglet('choisir')">🌤️ Mon humeur</button>
    <button class="tab"       onclick="afficherOnglet('histo')">📊 Historique</button>
  </div>

  <div id="panneau-choisir">
    <div class="form-humeur">
      <h2>Comment tu te sens ?</h2>
      <div class="grille-humeurs" id="grille-humeurs"></div>
      <div style="margin-bottom:12px;">
        <label for="note-humeur">Un mot (optionnel)</label>
        <input type="text" id="note-humeur" placeholder="Ex : Bonne journée, un peu stressé…" maxlength="100">
      </div>
      <div id="msg-humeur"></div>
      <button class="btn btn-rose" onclick="posterHumeur()">Partager mon humeur 🌤️</button>
    </div>
  </div>

  <div id="panneau-histo">
    <div class="filtres-periode">
      <button class="filtre-btn actif" onclick="filtrerPeriode(7, this)">7 jours</button>
      <button class="filtre-btn"       onclick="filtrerPeriode(14, this)">2 semaines</button>
      <button class="filtre-btn"       onclick="filtrerPeriode(30, this)">1 mois</button>
      <button class="filtre-btn"       onclick="filtrerPeriode(0, this)">Tout</button>
    </div>
    <div class="graph-wrap" id="graph-wrap">
      <div class="graph-titre">Évolution de l'humeur dans le temps</div>
      <div class="graph-legende">
        <span><span class="legende-dot" style="background:var(--rose-fonce);"></span><span id="legende-moi">Moi</span></span>
        <span><span class="legende-dot" style="background:#2a6fc4;"></span><span id="legende-autre">L'autre</span></span>
      </div>
      <canvas id="graphique" height="200"></canvas>
      <div id="graph-vide" class="vide" style="display:none;">Pas encore assez de données.<br>Partage au moins 2 humeurs pour voir le graphique.</div>
    </div>
  </div>

</div>
<script type="module">
  import { getSession, connecterFirebase } from "../auth.js";
  import { ecouterJeu, ajouterItem, lireSalon } from "../db.js";

  const session = getSession();
  if (!session.code) { window.location.href = "../index.html"; }
  await connecterFirebase();

  let prenoms        = { A: "Joueur A", B: "Joueur B" };
  let humeurSelectee = null;
  let toutLHisto     = [];
  let joursFiltres   = 7;

  const HUMEURS = [
    { id: "degout",    emoji: "🤢", label: "Dégoûté",  valeur: 1 },
    { id: "colere",    emoji: "😠", label: "Colère",    valeur: 2 },
    { id: "peur",      emoji: "😨", label: "Peur",      valeur: 3 },
    { id: "aigri",     emoji: "😒", label: "Aigri",     valeur: 4 },
    { id: "tristesse", emoji: "😢", label: "Triste",    valeur: 5 },
    { id: "stress",    emoji: "😰", label: "Stressé",   valeur: 6 },
    { id: "fatigue",   emoji: "😴", label: "Fatigué",   valeur: 7 },
    { id: "neutre",    emoji: "😐", label: "Neutre",    valeur: 8 },
    { id: "surprise",  emoji: "😲", label: "Surpris",   valeur: 9 },
    { id: "detente",   emoji: "😌", label: "Détendu",  valeur: 10 },
    { id: "joie",      emoji: "😄", label: "Joie",      valeur: 11 },
    { id: "amour",     emoji: "🥰", label: "Amoureux",  valeur: 12 },
  ];
  const VALEUR_PAR_ID    = Object.fromEntries(HUMEURS.map(h => [h.id, h.valeur]));
  const EMOJI_PAR_VALEUR = Object.fromEntries(HUMEURS.map(h => [h.valeur, h.emoji]));

  const salon = await lireSalon(session.code);
  if (salon) {
    prenoms.A = salon.joueurA?.prenom ?? "Joueur A";
    prenoms.B = salon.joueurB?.prenom ?? "Joueur B";
  }

  const prenomMoi   = session.role === "joueurA" ? prenoms.A : prenoms.B;
  const prenomAutre = session.role === "joueurA" ? prenoms.B : prenoms.A;
  document.getElementById("nom-moi").textContent       = prenomMoi;
  document.getElementById("nom-autre").textContent     = prenomAutre;
  document.getElementById("legende-moi").textContent   = prenomMoi;
  document.getElementById("legende-autre").textContent = prenomAutre;

  // Grille : ordre positif → négatif pour la sélection
  document.getElementById("grille-humeurs").innerHTML =
    [...HUMEURS].reverse().map(h => `
      <button class="humeur-btn" onclick="selecHumeur('${h.id}', this)">
        <span class="h-emoji">${h.emoji}</span>
        ${h.label}
      </button>`).join("");

  window.selecHumeur = (id, el) => {
    document.querySelectorAll(".humeur-btn").forEach(b => b.classList.remove("selec"));
    el.classList.add("selec");
    humeurSelectee = HUMEURS.find(h => h.id === id);
  };

  window.afficherOnglet = (onglet) => {
    document.getElementById("panneau-choisir").style.display = onglet === "choisir" ? "block" : "none";
    document.getElementById("panneau-histo").style.display   = onglet === "histo"   ? "block" : "none";
    document.querySelectorAll(".tabs .tab").forEach((t, i) => {
      t.classList.toggle("actif", (i === 0 && onglet === "choisir") || (i === 1 && onglet === "histo"));
    });
    // Dessiner seulement quand le panneau est visible (largeur disponible)
    if (onglet === "histo") {
      // requestAnimationFrame garantit que le DOM est rendu avant de lire clientWidth
      requestAnimationFrame(() => dessinerGraphique());
    }
  };

  window.posterHumeur = async () => {
    const msgEl = document.getElementById("msg-humeur");
    if (!humeurSelectee) {
      msgEl.innerHTML = `<div class="msg msg-err">Choisis une humeur d'abord.</div>`;
      return;
    }
    const note = document.getElementById("note-humeur").value.trim();
    try {
      await ajouterItem(session.code, "jeu_humeur", {
        humeurId:   humeurSelectee.id,
        emoji:      humeurSelectee.emoji,
        label:      humeurSelectee.label,
        valeur:     humeurSelectee.valeur,
        note,
        auteur:     session.role,
        horodatage: Date.now()
      });
      document.getElementById("note-humeur").value = "";
      document.querySelectorAll(".humeur-btn").forEach(b => b.classList.remove("selec"));
      humeurSelectee = null;
      msgEl.innerHTML = `<div class="msg msg-ok">Humeur partagée ! ✓</div>`;
      setTimeout(() => msgEl.innerHTML = "", 2500);
    } catch (e) {
      msgEl.innerHTML = `<div class="msg msg-err">Erreur : ${e.message}</div>`;
    }
  };

  window.filtrerPeriode = (jours, btn) => {
    joursFiltres = jours;
    document.querySelectorAll(".filtre-btn").forEach(b => b.classList.remove("actif"));
    btn.classList.add("actif");
    dessinerGraphique();
  };

  function tempsDepuis(ts) {
    const diff = Date.now() - ts;
    const min  = Math.floor(diff / 60000);
    const h    = Math.floor(diff / 3600000);
    const j    = Math.floor(diff / 86400000);
    if (min < 1)  return "À l'instant";
    if (min < 60) return `Il y a ${min} min`;
    if (h < 24)   return `Il y a ${h}h`;
    return `Il y a ${j} jour${j > 1 ? "s" : ""}`;
  }

  function dessinerGraphique() {
    const canvasEl = document.getElementById("graphique");
    const videEl   = document.getElementById("graph-vide");
    // Lire la largeur du conteneur parent (visible à ce moment)
    const W = document.getElementById("graph-wrap").clientWidth - 32;
    const H = 200;
    canvasEl.width  = Math.max(W, 100);
    canvasEl.height = H;
    const ctx = canvasEl.getContext("2d");
    ctx.clearRect(0, 0, canvasEl.width, H);

    const maintenant = Date.now();
    const limite = joursFiltres > 0 ? maintenant - joursFiltres * 86400000 : 0;

    const itemsMoi   = toutLHisto
      .filter(h => h.auteur === session.role && (h.horodatage || 0) >= limite)
      .sort((a, b) => a.horodatage - b.horodatage);
    const itemsAutre = toutLHisto
      .filter(h => h.auteur !== session.role && (h.horodatage || 0) >= limite)
      .sort((a, b) => a.horodatage - b.horodatage);
    const tousItems  = [...itemsMoi, ...itemsAutre].sort((a, b) => a.horodatage - b.horodatage);

    if (tousItems.length < 2) {
      canvasEl.style.display = "none";
      videEl.style.display   = "block";
      return;
    }
    canvasEl.style.display = "block";
    videEl.style.display   = "none";

    const CW     = canvasEl.width;
    const PAD_L  = 36, PAD_R = 12, PAD_T = 16, PAD_B = 30;
    const gW     = CW - PAD_L - PAD_R;
    const gH     = H  - PAD_T - PAD_B;
    const tsMin  = tousItems[0].horodatage;
    const tsMax  = tousItems[tousItems.length - 1].horodatage;
    const tsRange= tsMax - tsMin || 1;

    const xPt = (ts)     => PAD_L + ((ts - tsMin) / tsRange) * gW;
    const yPt = (valeur) => PAD_T + gH - ((valeur - 1) / 11) * gH;

    // Grille horizontale
    ctx.strokeStyle = "#f0f0f0";
    ctx.lineWidth   = 1;
    [1, 4, 8, 12].forEach(v => {
      const y = yPt(v);
      ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(CW - PAD_R, y); ctx.stroke();
      ctx.fillStyle = "#bbb"; ctx.font = "10px sans-serif"; ctx.textAlign = "right";
      ctx.fillText(EMOJI_PAR_VALEUR[v] ?? "", PAD_L - 2, y + 4);
    });

    // Axe X
    ctx.fillStyle = "#bbb"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
    const nbLabels = Math.min(4, tousItems.length);
    for (let i = 0; i < nbLabels; i++) {
      const item = tousItems[Math.floor(i * (tousItems.length - 1) / Math.max(nbLabels - 1, 1))];
      const x    = xPt(item.horodatage);
      const d    = new Date(item.horodatage);
      ctx.fillText(`${d.getDate()}/${d.getMonth() + 1}`, x, H - 4);
    }

    function tracerCourbe(items, couleur) {
      if (items.length === 0) return;
      ctx.beginPath();
      ctx.strokeStyle = couleur;
      ctx.lineWidth   = 2.5;
      ctx.lineJoin    = "round";
      items.forEach((item, i) => {
        const v = item.valeur ?? VALEUR_PAR_ID[item.humeurId] ?? 8;
        const x = xPt(item.horodatage);
        const y = yPt(v);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      items.forEach(item => {
        const v = item.valeur ?? VALEUR_PAR_ID[item.humeurId] ?? 8;
        const x = xPt(item.horodatage);
        const y = yPt(v);
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = couleur; ctx.fill();
        ctx.font = "13px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(item.emoji ?? EMOJI_PAR_VALEUR[v] ?? "😐", x, y - 8);
      });
    }

    tracerCourbe(itemsMoi,   "#c4607a");
    tracerCourbe(itemsAutre, "#2a6fc4");
  }

  ecouterJeu(session.code, "jeu_humeur", (items) => {
    toutLHisto = items;

    const derniereMoi   = [...items]
      .filter(h => h.auteur === session.role)
      .sort((a, b) => (b.horodatage || 0) - (a.horodatage || 0))[0];
    const derniereAutre = [...items]
      .filter(h => h.auteur !== session.role)
      .sort((a, b) => (b.horodatage || 0) - (a.horodatage || 0))[0];

    if (derniereMoi) {
      document.getElementById("emoji-moi").textContent   = derniereMoi.emoji;
      document.getElementById("label-moi").textContent   = derniereMoi.label;
      document.getElementById("depuis-moi").textContent  = tempsDepuis(derniereMoi.horodatage || 0);
    }
    if (derniereAutre) {
      document.getElementById("emoji-autre").textContent  = derniereAutre.emoji;
      document.getElementById("label-autre").textContent  = derniereAutre.label;
      document.getElementById("depuis-autre").textContent = tempsDepuis(derniereAutre.horodatage || 0);
    }

    // Redessiner seulement si l'onglet histo est visible
    const panneau = document.getElementById("panneau-histo");
    if (panneau.style.display !== "none") {
      requestAnimationFrame(() => dessinerGraphique());
    }
  });
</script>
</body>
</html>

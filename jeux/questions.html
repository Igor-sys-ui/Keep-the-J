<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>36 Questions — Keep The J</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .question-choix { background: var(--blanc); border-radius: var(--rayon); padding: 16px; box-shadow: var(--ombre); margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; font-size: 0.95rem; color: var(--noir); }
    .question-choix:hover { border-color: var(--rose); background: var(--rose-clair); }
    .question-choix.selec { border-color: var(--rose-fonce); background: var(--rose-clair); }
    .form-question { background: var(--blanc); border-radius: var(--rayon); padding: 20px; box-shadow: var(--ombre); margin-bottom: 24px; }
    .qr-card { background: var(--blanc); border-radius: var(--rayon); padding: 18px; box-shadow: var(--ombre); margin-bottom: 16px; }
    .qr-question { font-weight: 700; font-size: 1rem; margin-bottom: 14px; color: var(--noir); padding-bottom: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .qr-question .q-texte { flex: 1; }
    .qr-question .q-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .reponse-bloc { margin-bottom: 10px; }
    .reponse-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .label-a { color: var(--rose-fonce); }
    .label-b { color: #2a6fc4; }
    .reponse-texte { background: var(--gris-clair); border-radius: 8px; padding: 10px 14px; font-size: 0.9rem; }
    .reponse-attente { background: #fff8e1; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; color: #7a6000; font-style: italic; }
    .zone-reponse { margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; }
    .tabs { display: flex; background: var(--gris-clair); border-radius: var(--rayon); padding: 4px; margin-bottom: 16px; }
    .tab  { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; color: var(--gris); transition: all 0.2s; }
    .tab.actif { background: var(--blanc); color: var(--rose-fonce); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .section-titre { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--gris); margin-bottom: 12px; }
    .vide { text-align: center; padding: 32px 0; color: #bbb; font-size: 0.9rem; }
    #panneau-perso { display: none; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <a href="../app.html" class="back">←</a>
    <h1>💬 36 Questions</h1>
  </div>

  <div class="msg msg-info" style="margin-bottom:20px;">
    Choisis une question ou écris la tienne. Tu verras la réponse de l'autre seulement après avoir répondu ! 💡
  </div>

  <div class="tabs">
    <button class="tab actif" onclick="afficherOnglet('banque')">📚 Banque de questions</button>
    <button class="tab"       onclick="afficherOnglet('perso')">✏️ Ma question</button>
  </div>

  <div id="panneau-banque">
    <div id="liste-questions-banque"></div>
    <button class="btn btn-rose" id="btn-envoyer-banque" onclick="envoyerQuestionBanque()" style="display:none;margin-top:8px;">
      Envoyer cette question 💬
    </button>
  </div>

  <div id="panneau-perso">
    <div class="form-question">
      <h2>✏️ Poser ma propre question</h2>
      <label for="ma-question">Ta question</label>
      <textarea id="ma-question" placeholder="Ex : Si tu pouvais revivre une journée de notre vie, laquelle choisirais-tu ?"></textarea>
      <label for="ma-reponse-perso">Ta réponse</label>
      <textarea id="ma-reponse-perso" placeholder="Réponds avant d'envoyer…"></textarea>
      <div id="msg-form-perso"></div>
      <button class="btn btn-rose" onclick="envoyerQuestionPerso()">Envoyer 💬</button>
    </div>
  </div>

  <hr class="sep">
  <div class="section-titre">📖 Questions posées</div>
  <div id="fil-questions"><div class="spinner">Chargement…</div></div>

</div>
<script type="module">
  import { getSession, connecterFirebase } from "../auth.js";
  import { ecouterJeu, ajouterItem, modifierItem, supprimerItem, lireSalon } from "../db.js";
  import { toggleFavori } from "../favoris.js";

  const session = getSession();
  if (!session.code) { window.location.href = "../index.html"; }
  await connecterFirebase();

  let prenoms = { A: "Joueur A", B: "Joueur B" };
  let questionSelectee = null;

  const salon = await lireSalon(session.code);
  if (salon) {
    prenoms.A = salon.joueurA?.prenom ?? "Joueur A";
    prenoms.B = salon.joueurB?.prenom ?? "Joueur B";
  }

  const BANQUE = [
    "Quel est ton souvenir préféré de nous deux ?",
    "Si tu pouvais revivre une journée de notre vie, laquelle choisirais-tu et pourquoi ?",
    "Quelle est la chose qui t'a le plus surpris chez moi depuis qu'on se connaît ?",
    "Qu'est-ce que tu rêves de faire dans 5 ans ?",
    "Quelle chanson te fait penser à moi ?",
    "Quel est ton endroit préféré dans le monde et pourquoi ?",
    "Quelle est la chose dont tu es le plus fier(e) dans ta vie ?",
    "Si tu devais me décrire en trois mots, lesquels choisirais-tu ?",
    "Quel est ton plus grand rêve qu'on n'a jamais réalisé ensemble ?",
    "Qu'est-ce que tu faisais quand tu étais heureux(se) enfant ?",
    "Y a-t-il quelque chose que tu voudrais me dire mais que tu n'as jamais osé ?",
    "Qu'est-ce qui te manque le plus en ce moment ?",
    "Quelle est la chose la plus courageuse que tu aies jamais faite ?",
    "Si on pouvait partir quelque part demain, où irais-tu ?",
    "Quel est ton rituel préféré de la journée ?"
  ];

  document.getElementById("liste-questions-banque").innerHTML = BANQUE.map((q, i) => `
    <div class="question-choix" onclick="selectionnerQuestion(${i}, this)">${q}</div>
  `).join("");

  window.selectionnerQuestion = (i, el) => {
    document.querySelectorAll(".question-choix").forEach(e => e.classList.remove("selec"));
    el.classList.add("selec");
    questionSelectee = BANQUE[i];
    document.getElementById("btn-envoyer-banque").style.display = "block";
  };

  window.afficherOnglet = (onglet) => {
    document.getElementById("panneau-banque").style.display = onglet === "banque" ? "block" : "none";
    document.getElementById("panneau-perso").style.display  = onglet === "perso"  ? "block" : "none";
    document.querySelectorAll(".tab").forEach((t, i) => {
      t.classList.toggle("actif", (i === 0 && onglet === "banque") || (i === 1 && onglet === "perso"));
    });
  };

  window.envoyerQuestionBanque = () => {
    if (!questionSelectee) return;
    const rep = prompt(`Ta réponse à : "${questionSelectee}"`);
    if (!rep || !rep.trim()) { alert("Tu dois répondre pour envoyer la question !"); return; }
    envoyer(questionSelectee, rep.trim());
  };

  window.envoyerQuestionPerso = async () => {
    const question = document.getElementById("ma-question").value.trim();
    const reponse  = document.getElementById("ma-reponse-perso").value.trim();
    const msgEl    = document.getElementById("msg-form-perso");
    if (!question) { msgEl.innerHTML = `<div class="msg msg-err">Écris ta question.</div>`; return; }
    if (!reponse)  { msgEl.innerHTML = `<div class="msg msg-err">Réponds d'abord à ta propre question !</div>`; return; }
    await envoyer(question, reponse);
    document.getElementById("ma-question").value      = "";
    document.getElementById("ma-reponse-perso").value = "";
    msgEl.innerHTML = `<div class="msg msg-ok">Question envoyée ! ✓</div>`;
    setTimeout(() => msgEl.innerHTML = "", 2500);
  };

  async function envoyer(question, reponse) {
    await ajouterItem(session.code, "jeu_questions", {
      question,
      reponseA: session.role === "joueurA" ? reponse : null,
      reponseB: session.role === "joueurB" ? reponse : null,
      auteur:   session.role
    });
    questionSelectee = null;
    document.querySelectorAll(".question-choix").forEach(e => e.classList.remove("selec"));
    document.getElementById("btn-envoyer-banque").style.display = "none";
  }

  window.supprimerQuestion = async (id) => {
    if (!confirm("Supprimer cette question et ses réponses ?")) return;
    await supprimerItem(session.code, "jeu_questions", id);
  };

  window.repondre = async (id) => {
    const cleReponse = session.role === "joueurA" ? "reponseA" : "reponseB";
    const rep = document.getElementById(`rep-${id}`).value.trim();
    if (!rep) { alert("Écris ta réponse avant de valider."); return; }
    await modifierItem(session.code, "jeu_questions", id, { [cleReponse]: rep });
  };

  window.toggleFavoriLocal = async (jeu, itemId, apercu) => {
    const btn    = document.getElementById("fav-" + itemId);
    const ajoute = await toggleFavori(session.code, session.role, jeu, itemId, apercu);
    if (btn) btn.textContent = ajoute ? "❤️" : "🤍";
  };

  ecouterJeu(session.code, "jeu_questions", (questions) => {
    const fil = document.getElementById("fil-questions");
    if (questions.length === 0) {
      fil.innerHTML = `<div class="vide">Aucune question posée.<br>Lance la première ! 💬</div>`;
      return;
    }
    [...questions].reverse().forEach(q => {
      const monRole       = session.role;
      const cleReponse    = monRole === "joueurA" ? "reponseA" : "reponseB";
      const cleAutre      = monRole === "joueurA" ? "reponseB" : "reponseA";
      const prenomMoi     = monRole === "joueurA" ? prenoms.A : prenoms.B;
      const prenomAutre   = monRole === "joueurA" ? prenoms.B : prenoms.A;
      const labelMoiCls   = monRole === "joueurA" ? "label-a" : "label-b";
      const labelAutreCls = monRole === "joueurA" ? "label-b" : "label-a";
      const jaRepondu     = !!q[cleReponse];
      const autreRepondu  = !!q[cleAutre];

      let maRepHtml = jaRepondu
        ? `<div class="reponse-bloc">
             <div class="reponse-label ${labelMoiCls}">${prenomMoi}</div>
             <div class="reponse-texte">${q[cleReponse]}</div>
           </div>`
        : `<div class="zone-reponse">
             <label style="color:var(--rose-fonce);font-size:0.85rem;">✏️ Ta réponse</label>
             <textarea id="rep-${q.id}" placeholder="Réponds pour voir celle de l'autre…" style="margin-bottom:8px;"></textarea>
             <button class="btn btn-rose" onclick="repondre('${q.id}')" style="padding:10px;">Valider ma réponse</button>
           </div>`;

      let autreRepHtml = !jaRepondu
        ? `<div class="reponse-attente">🔒 Réponds d'abord pour voir la réponse de ${prenomAutre}…</div>`
        : autreRepondu
          ? `<div class="reponse-bloc">
               <div class="reponse-label ${labelAutreCls}">${prenomAutre}</div>
               <div class="reponse-texte">${q[cleAutre]}</div>
             </div>`
          : `<div class="reponse-attente">⏳ En attente de la réponse de ${prenomAutre}…</div>`;

      const apercuFav = q.question.substring(0, 60).replace(/'/g, "");
      const html = `
        <div class="qr-card" id="qr-${q.id}">
          <div class="qr-question">
            <span class="q-texte">💬 ${q.question}</span>
            <span class="q-actions">
              <button id="fav-${q.id}"
                onclick="toggleFavoriLocal('jeu_questions','${q.id}','${apercuFav}')"
                style="background:none;border:none;font-size:1rem;cursor:pointer;padding:2px;"
                title="Favori">🤍</button>
              <button onclick="supprimerQuestion('${q.id}')"
                style="background:none;border:none;font-size:1rem;cursor:pointer;padding:2px;color:#ddd;"
                title="Supprimer">🗑</button>
            </span>
          </div>
          ${maRepHtml}
          ${autreRepHtml}
        </div>`;

      const existant = document.getElementById(`qr-${q.id}`);
      if (existant) {
        const champ = existant.querySelector("textarea");
        if (!champ || !champ.value) existant.outerHTML = html;
      } else {
        fil.innerHTML += html;
      }
    });
    document.querySelectorAll("[id^='qr-']").forEach(el => {
      const id = el.id.replace("qr-", "");
      if (!questions.find(q => q.id === id)) el.remove();
    });
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep The J — Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .top-bar h1 { font-size: 1.5rem; color: var(--rose-fonce); }

    .salon-info {
      background: var(--blanc);
      border-radius: var(--rayon);
      padding: 16px 20px;
      box-shadow: var(--ombre);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .salon-info .joueurs { display: flex; gap: 10px; align-items: center; }
    .salon-info .code-salon {
      font-size: 0.78rem;
      color: var(--gris);
      text-align: right;
    }
    .salon-info .code-salon span {
      font-weight: 700;
      color: var(--rose-fonce);
      letter-spacing: 1px;
    }

    .section-titre {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gris);
      margin-bottom: 12px;
      margin-top: 8px;
    }

    /* Couleurs par jeu */
    .jeu-card.points     { border-color: #f9c74f; }
    .jeu-card.boite      { border-color: var(--rose); }
    .jeu-card.pictionary { border-color: #90d7ff; }
    .jeu-card.questions  { border-color: var(--vert); }
    .jeu-card.escape     { border-color: #b5a0e8; }

    .jeu-card.bientot {
      opacity: 0.5;
      cursor: default;
      pointer-events: none;
    }
    .jeu-card .bientot-badge {
      font-size: 0.7rem;
      background: #eee;
      color: #999;
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* Bouton déconnexion */
    .btn-deco {
      background: none;
      border: none;
      color: var(--gris);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
    }

    /* Statut connexion partenaire */
    .statut-partenaire {
      font-size: 0.82rem;
      color: var(--gris);
      text-align: center;
      margin-bottom: 16px;
    }
    .statut-partenaire .online  { color: var(--vert); font-weight: 700; }
    .statut-partenaire .attente { color: #f4a261; font-weight: 700; }
  </style>
</head>
<body>
<div class="container">

  <!-- Barre du haut -->
  <div class="top-bar">
    <h1>💌 Keep The J</h1>
    <button class="btn-deco" onclick="deconnecterSession()" title="Quitter">🚪</button>
  </div>

  <!-- Chargement -->
  <div id="chargement" class="spinner">Connexion en cours…</div>

  <!-- Contenu principal (caché pendant le chargement) -->
  <div id="contenu" style="display:none">

    <!-- Infos salon -->
    <div class="salon-info">
      <div class="joueurs">
        <span class="badge badge-a" id="nom-a">—</span>
        <span style="color:#ccc">♥</span>
        <span class="badge badge-b" id="nom-b">—</span>
      </div>
      <div class="code-salon">
        Code salon<br>
        <span id="code-affiche">—</span>
      </div>
    </div>

    <!-- Statut partenaire -->
    <div class="statut-partenaire" id="statut-partenaire"></div>

    <!-- Grille des jeux -->
    <div class="section-titre">🎮 Les jeux</div>
    <div class="jeux-grid">

      <a href="jeux/points.html" class="jeu-card points">
        <span class="emoji">🏆</span>
        <span class="nom">Défis & Points</span>
        <span class="desc">Missions à accomplir</span>
      </a>

      <a href="jeux/boite.html" class="jeu-card boite">
        <span class="emoji">🔒</span>
        <span class="nom">Boîte Secrète</span>
        <span class="desc">Photo ou message caché</span>
      </a>

      <a href="jeux/pictionary.html" class="jeu-card pictionary">
        <span class="emoji">🎨</span>
        <span class="nom">Pictionary</span>
        <span class="desc">Dessine un souvenir</span>
      </a>

      <a href="jeux/questions.html" class="jeu-card questions">
        <span class="emoji">💬</span>
        <span class="nom">Questions Vie</span>
        <span class="desc">Réponses croisées</span>
      </a>

      <a href="jeux/escape.html" class="jeu-card escape bientot">
        <span class="emoji">🗝️</span>
        <span class="nom">Escape Game</span>
        <span class="bientot-badge">Bientôt</span>
      </a>

    </div>

    <!-- Bouton quitter -->
    <hr class="sep">
    <button class="btn btn-gris" onclick="deconnecterSession()">🚪 Quitter le salon</button>

  </div><!-- /contenu -->

</div><!-- /container -->

<script type="module">
  import { getSession, ecouterSalon, deconnecter, connecterFirebase } from "./auth.js";

  const session = getSession();

  // Si pas de session, retour à l'accueil
  if (!session.code) {
    window.location.href = "index.html";
  }

  await connecterFirebase();

  // Écouter le salon en temps réel
  const stop = ecouterSalon(session.code, (data) => {
    document.getElementById("chargement").style.display = "none";
    document.getElementById("contenu").style.display    = "block";

    // Noms des joueurs
    document.getElementById("nom-a").textContent = data.joueurA?.prenom ?? "Joueur A";
    document.getElementById("nom-b").textContent = data.joueurB?.prenom ?? "En attente…";
    document.getElementById("code-affiche").textContent = session.code;

    // Statut partenaire
    const statutEl = document.getElementById("statut-partenaire");
    if (!data.joueurB) {
      statutEl.innerHTML = `<span class="attente">⏳ En attente que l'autre joueur rejoigne…</span><br>
        Code à partager : <strong>${session.code}</strong>`;
    } else {
      const partenairePrenom = session.role === "joueurA"
        ? data.joueurB.prenom
        : data.joueurA.prenom;
      statutEl.innerHTML = `<span class="online">✓</span> ${partenairePrenom} est dans le salon`;
    }
  });

  // Déconnexion
  window.deconnecterSession = () => {
    if (confirm("Quitter le salon ? Tu pourras le rejoindre à nouveau avec le code.")) {
      stop();
      deconnecter();
    }
  };
</script>
</body>
</html>
